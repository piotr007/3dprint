services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: 3dprint-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - 3dprint-net

  web:
    image: nginx:1.27-alpine
    container_name: 3dprint-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - 3dprint-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: 3dprint-mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - 3dprint-net

  db:
    image: mysql:8.4
    container_name: 3dprint-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-3dprint}
      MYSQL_USER: ${MYSQL_USER:-3dprint}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-3dprint}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - 3dprint-net

networks:
  3dprint-net:
    driver: bridge

volumes:
  mysql-data:
